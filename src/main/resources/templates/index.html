<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Forensic PMO Calculator</title>
<style>
body {
font-family: Futura, sans-serif;
margin: 40px;
background-color: #f4f4f4;
color: #333;
}
.container {
max-width: 600px;
background: white;
padding: 20px;
border-radius: 8px;
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
h1 {
color: #2c3e50;
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
font-weight: bold;
}
input, select {
width: 100%;
padding: 8px;
border: 1px solid #ccc;
border-radius: 4px;
box-sizing: border-box;
}
button {
background-color: #2c3e50;
color: white;
padding: 10px 15px;
border: none;
border-radius: 4px;
cursor: pointer;
font-size: 16px;
}
button:hover {
background-color: #34495e;
}
.result {
margin-top: 20px;
padding: 15px;
background: #eef2f7;
border-left: 5px solid #2c3e50;
border-radius: 4px;
}
pre {
white-space: pre-wrap;
font-family: monospace;
}
</style>
</head>
<body>

<div class="container">
<h1>Forensic PMO Calculator</h1>
<p>Enter the case metrics below to run the post mortem analysis.</p>

<form action="/calculate" method="POST">
<div class="form-group">
<label for="victimId">Target Profile ID:</label>
<input type="text" id="victimId" name="victimId" required placeholder="e.g. Case-001">
</div>

<div class="form-group">
<label for="bodyTemp">Body Temperature (°C):</label>
<input type="number" step="0.1" id="bodyTemp" name="bodyTemp" required th:value="${bodyTemp}">
</div>

<div class="form-group">
<label for="ambientTemp">Ambient/Scene Temperature (°C):</label>
<input type="number" step="0.1" id="ambientTemp" name="ambientTemp" required th:value="${ambientTemp}">
</div>

<div class="form-group">
<label for="livorColor">Livor Mortis Color:</label>
<input type="text" id="livorColor" name="livorColor" required placeholder="e.g. Purple">
</div>

<div class="form-group">
<label for="isLivorFixed">Is Livor Fixed?</label>
<select id="isLivorFixed" name="isLivorFixed">
<option value="true">Yes</option>
<option value="false">No</option>
</select>
</div>

<!-- Distinct rigor name bindings fixed below -->
<div class="form-group">
<label th:for="rigorJaw">Rigor Stage - Jaw:</label>
<select id="rigorJaw" name="rigorJaw">
<option value="0">0 - Absent</option>
<option value="1">1 - Minimal / Setting</option>
<option value="2">2 - Moderate / Developing</option>
<option value="3">3 - Fully Rigid / Peak</option>
</select>
</div>

<div class="form-group">
<label th:for="rigorArms">Rigor Stage - Arms:</label>
<select id="rigorArms" name="rigorArms">
<option value="0">0 - Absent</option>
<option value="1">1 - Minimal / Setting</option>
<option value="2">2 - Moderate / Developing</option>
<option value="3">3 - Fully Rigid / Peak</option>
</select>
</div>

<div class="form-group">
<label th:for="rigorLegs">Rigor Stage - Legs:</label>
<select id="rigorLegs" name="rigorLegs">
<option value="0">0 - Absent</option>
<option value="1">1 - Minimal / Setting</option>
<option value="2">2 - Moderate / Developing</option>
<option value="3">3 - Fully Rigid / Peak</option>
</select>
</div>

<button type="submit">Run Analysis Report</button>
</form>

<!-- Displays the text layout report dynamically after submission -->
<div class="result" th:if="${report}">
<h2>Analysis Result</h2>
<pre th:text="${report}"></pre>
</div>
</div>

</body>
</html>
